[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-infra-design-agents"
version = "0.1.0"
description = "Workflow, wiki, and RLCR tooling for RL infrastructure design agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = [".agents/skills/RLInfraWiki/tests"]
python_files = ["test_*.py"]
