name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python .agents/skills/RLInfraWiki/scripts/validate.py
      - run: python .agents/skills/RLInfraWiki/scripts/generate_indices.py --check
      - run: python .agents/skills/RLInfraWiki/scripts/repo_status.py
      - run: pytest -q
